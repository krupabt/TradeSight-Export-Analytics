name: Weekly Operational Exception & Compliance Report

on:
  schedule:
    # Run every Monday at 08:00 UTC (01:30 PM IST)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (validates report generation without external SMTP dispatch)'
        required: true
        type: boolean
        default: true
      recipient_email:
        description: 'Authorized recipient email for manual dispatch test'
        required: false
        type: string
        default: ''

jobs:
  generate-and-dispatch-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated validation & test suite
        run: |
          pytest -q tests/test_validation.py tests/test_reporting.py

      - name: Generate weekly operational exception reports
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'True' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENTS: ${{ github.event.inputs.recipient_email || secrets.ALERT_RECIPIENTS }}
          APP_ENV: ${{ github.event.inputs.test_mode == false && 'production' || 'test' }}
        run: |
          python -c "
          import os, sys, glob
          from src.pipeline import run_pipeline
          from src.reporting import send_smtp_alert

          test_mode = os.environ.get('APP_ENV', 'test') == 'test'
          print(f'Starting automated weekly reporting job (Test Mode: {test_mode})...')

          # 1. Run data pipeline and exception report generation
          exit_code = run_pipeline()
          if exit_code != 0:
              sys.exit(exit_code)
          print('Pipeline executed successfully.')

          # 2. Attempt SMTP dispatch if configured
          latest_reports = sorted(glob.glob('reports/weekly_exception_report_*.md'))
          latest_csvs = sorted(glob.glob('outputs/weekly_exception_report_*.csv'))
          attachments = []
          if latest_csvs:
              attachments.append(latest_csvs[-1])
          if latest_reports:
              attachments.append(latest_reports[-1])

          if latest_reports:
              with open(latest_reports[-1], 'r', encoding='utf-8') as f:
                  md_content = f.read()
              dispatched = send_smtp_alert(
                  subject='[TradeSight] Weekly Operational Exception & Compliance Report',
                  body_markdown=md_content,
                  attachments=attachments
              )
              print(f'SMTP Dispatch Result: {dispatched}')
          else:
              print('No weekly exception report markdown found to dispatch.')
          "

      - name: Upload weekly exception reports
        uses: actions/upload-artifact@v4
        with:
          name: weekly-exception-reports
          path: |
            outputs/weekly_exception_report_*.csv
            reports/weekly_exception_report_*.md
          retention-days: 30
